name: Fetch news

on:
  # Every 3 hours, avoiding the congested hour around midnight UTC where
  # GitHub's cron scheduler drops occurrences.
  schedule:
    - cron: "41 2-23/3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The fetch script only uses Node built-ins — no npm ci needed.
      - name: Fetch news feeds
        run: node scripts/fetch-news.mjs

      # News data would bloat main's history at 8 commits/day, so it lives
      # on a `data` branch that is reset from main and force-pushed each
      # run — always exactly one data commit ahead of main. Deploy overlays
      # it at build time. GITHUB_TOKEN pushes can't fire other workflows,
      # so Deploy listens for this workflow's completion via workflow_run.
      - name: Publish data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B data
          git add -f public/data
          git commit -m "data: news refresh"
          git push -f origin data
