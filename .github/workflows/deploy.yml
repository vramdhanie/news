name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Redeploy after each successful news refresh (the fetch bot's
  # GITHUB_TOKEN push can't fire the push trigger).
  workflow_run:
    workflows: ["Fetch news"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # For workflow_run triggers, only deploy after a successful fetch.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Overlay latest news data from the data branch
        run: |
          if git fetch origin data; then
            git checkout FETCH_HEAD -- public/data && echo "data overlaid"
          else
            echo "no data branch yet — deploying with empty state"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
